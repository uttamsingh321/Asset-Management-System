<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AssetVerify – Enterprise Asset Verification</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e7eb;--ac:#4f46e5;--acs:#eef2ff;--ok:#059669;--oks:#d1fae5;--wa:#b45309;--was:#fef3c7;--bad:#dc2626;--bads:#fee2e2;--in:#1d4ed8;--ins:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0f17;--card:#131a26;--tx:#e6eaf2;--mu:#8b97ab;--bd:#243044;--ac:#818cf8;--acs:#1e2547;--ok:#34d399;--oks:#0d3a2c;--wa:#fbbf24;--was:#3b2d0b;--bad:#f87171;--bads:#3f1717;--in:#93c5fd;--ins:#172a4d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0f17;--card:#131a26;--tx:#e6eaf2;--mu:#8b97ab;--bd:#243044;--ac:#818cf8;--acs:#1e2547;--ok:#34d399;--oks:#0d3a2c;--wa:#fbbf24;--was:#3b2d0b;--bad:#f87171;--bads:#3f1717;--in:#93c5fd;--ins:#172a4d}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:16px;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}.logo i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.nav button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;color:var(--mu);padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px;text-align:left}
.nav button:hover{background:var(--bg)}.nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
main{min-width:0;padding:20px 28px 40px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:20px;margin:0}.sub{color:var(--mu);font-size:13px}
select,input,textarea,button{font:inherit;color:var(--tx)}
select,input[type=text],input[type=search],textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 12px;font-size:14px}.kpi .l{color:var(--mu);font-size:12px}.kpi .v{font-size:28px;font-weight:700;margin-top:2px}.kpi .s{font-size:12px;color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar b{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
.dp{display:grid;grid-template-columns:100px 1fr 70px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.dp span:last-child{text-align:right;color:var(--mu)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-Completed{background:var(--oks);color:var(--ok)}.b-Pending{background:var(--was);color:var(--wa)}.b-Imported{background:var(--ins);color:var(--in)}.b-Assigned{background:var(--acs);color:var(--ac)}.b-Rejected{background:var(--bads);color:var(--bad)}
.c-Good{color:var(--ok)}.c-Fair{color:var(--wa)}.c-Poor,.c-Damaged{color:var(--bad)}
.tw{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px}th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border:0}tbody tr:hover{background:var(--bg)}
.mono{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;margin:auto}.ring div{width:88px;height:88px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;font-weight:700}
.act{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.act:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);margin-top:6px;flex:none}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--mu);cursor:pointer}.tabs button.on{background:var(--acs);color:var(--ac);font-weight:600}
.drawer{position:fixed;inset:0;background:rgba(2,6,23,.5);display:none;justify-content:flex-end;z-index:20}.drawer.open{display:flex}
.panel{background:var(--card);width:min(520px,100%);height:100%;overflow:auto;padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{border:1.5px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;color:var(--mu);cursor:pointer;display:block}.pic img{max-width:100%;max-height:160px;border-radius:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30;display:none}
.err{color:var(--bad);font-size:12px;margin-top:3px}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.th{height:130px;border-radius:10px;background:var(--bg);border:1.5px dashed var(--bd);display:grid;place-items:center;text-align:center;color:var(--mu);overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}.drop{border:2px dashed var(--ac);background:var(--acs);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px}.logo{padding:0 8px}.nav{display:flex;gap:4px}.nav button{width:auto;white-space:nowrap}main{padding:16px}}
</style></head><body>
<div class="app"><aside><div class="logo"><i>✓</i>AssetVerify</div><div class="nav" id="nav"></div></aside><main id="main"></main></div>
<div class="drawer" id="dr"><div class="panel" id="panel"></div></div><div class="toast" id="toast"></div>
<script>
const DEPTS=[["IT",22],["HR",8],["Finance",10],["Production",28],["Engineering",16],["Warehouse",10],["Administration",6]];
const DC={IT:"#6366f1",HR:"#ec4899",Finance:"#f59e0b",Production:"#10b981",Engineering:"#06b6d4",Warehouse:"#f97316",Administration:"#8b5cf6"};
const BLD=["C39","D197","D198","D199"],COND=["Good","Fair","Poor","Damaged"],COMP=["IIPL","Padget"];
const LOC=["Server Room","Open Office","Assembly Line 2","Store Rack A","Meeting Room 3","Reception","Lab Bench","Loading Bay","Finance Vault","Cabin 12"];
let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
const FN=["Aarav","Neha","Rohan","Priya","Vikram","Anita","Karan","Sneha","Arjun","Meera"],LN=["Sharma","Verma","Singh","Gupta","Mehta","Iyer","Nair","Reddy","Khan","Das"];
const EMP=[];for(let i=0;i<40;i++)EMP.push({id:"EMP"+String(1001+i),name:pick(FN)+" "+pick(LN),dept:DEPTS[i%7][0]});
const ph=c=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200'><rect width='300' height='200' fill='#c7d2fe'/><rect x='95' y='60' width='110' height='80' rx='10' fill='#6366f1'/><text x='150' y='168' font-size='16' text-anchor='middle' font-family='sans-serif' fill='#312e81'>${c}</text></svg>`);
const T0=Date.now(),day=864e5,fmt=t=>new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
let codes=[...Array(100)].map((_,i)=>i+1);for(let i=99;i>0;i--){const j=Math.floor(rnd()*(i+1));[codes[i],codes[j]]=[codes[j],codes[i]]}
const assets=[];let k=0;DEPTS.forEach(([d,n])=>{for(let i=0;i<n;i++){const num=codes[k++],done=rnd()<.45,e=pick(EMP.filter(x=>x.dept==d));
const cd0="AST"+String(num).padStart(6,"0");assets.push({code:cd0,dept:d,status:done?"Completed":"Pending Verification",company:done?pick(COMP):"",building:done?pick(BLD):"",floor:done?String(1+Math.floor(rnd()*5)):"",loc:done?pick(LOC):"",empId:done?e.id:"",empName:done?e.name:"",cond:done?pick(COND):"",remarks:done?"Verified on site":"",pic:done?ph(cd0):null,updated:done?T0-rnd()*14*day:T0-20*day})}});
assets.sort((a,b)=>a.code<b.code?-1:1);
const transfers=[];let tn=0;
const mkT=(a,toDept,b,f,l,why,req,st,by,note)=>{const r=EMP.filter(e=>e.dept==req)[1];transfers.unshift({id:"TRF-"+String(++tn).padStart(4,"0"),code:a.code,lender:a.dept,toDept,toBuilding:b,toFloor:f,toLoc:l,from:(a.building||"—")+" / F"+(a.floor||"—")+" / "+(a.loc||"—"),reason:why,reqName:r.name,reqId:r.id,reqDept:req,status:st,ts:T0-tn*18e6,by:by||"",note:note||"",decTs:by?T0-tn*14e6:0})};
mkT(assets.filter(a=>a.dept=="Administration")[0],"Production","D199","1","Cabin 12","Temporary use on the floor","Production","Rejected",EMP.find(e=>e.dept=="Administration").name+" (Head)","Required for the upcoming audit");
mkT(assets.filter(a=>a.dept=="IT")[0],"Production","D197","2","Assembly Line 2","Needed for line monitoring","Production","Pending Approval");
mkT(assets.filter(a=>a.dept=="Warehouse")[0],"Engineering","C39","1","Lab Bench","Calibration jig for testing","Engineering","Pending Approval");
mkT(assets.filter(a=>a.dept=="IT")[1],"IT","D198","3","Server Room","Moving to the new server room","IT","Pending Approval");
const hist=[{id:"IMP-001",file:"asset_codes_batch1.xlsx",n:100,by:"Admin User",ts:T0-20*day,st:"Success"}];
const dev=(()=>{const u=navigator.userAgent;return{browser:/Edg/.test(u)?"Edge":/Chrome/.test(u)?"Chrome":/Firefox/.test(u)?"Firefox":/Safari/.test(u)?"Safari":"Browser",os:/Windows/.test(u)?"Windows":/Android/.test(u)?"Android":/iPhone|iPad/.test(u)?"iOS":/Mac/.test(u)?"macOS":"Linux",type:/Mobi|Android|iPhone/.test(u)?"Mobile":"Desktop"}})();
let user={name:"Admin User",id:"USR-0001",dept:"All",role:"admin"},logins={},logs=[];
function log(action,code){logs.unshift({user:user.name,uid:user.id,dept:user.dept,login:logins[user.id],dt:dev.type,br:dev.browser,os:dev.os,ip:"10.24."+(user.id.length*7%200)+"."+(user.id.charCodeAt(user.id.length-1)%250),action,ts:Date.now(),code:code||"—"})}
function login(){logins[user.id]=Date.now();log("Login")}
let view="dashboard",atab="import",S={q:"",st:"",bd:"",cd:"",sort:"code",dir:1,pg:1},open=null;
const $=s=>document.querySelector(s),scope=()=>user.role=="admin"?assets:assets.filter(a=>a.dept==user.dept);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bc=s=>s=="Pending Approval"||s=="Pending Verification"?"Pending":s=="Approved"?"Completed":s=="Photo Uploaded"?"Assigned":s,badge=s=>`<span class="badge b-${bc(s)}">${s}</span>`;
const stats=l=>{const c=l.filter(a=>a.status=="Completed").length;return{t:l.length,c,p:l.filter(a=>a.status=="Pending Verification").length,pct:l.length?Math.round(c/l.length*100):0}};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",2200)}
function nav(){const items=[["dashboard","▦","Dashboard"],["photos","📷","Photo Upload"],["assets","☰","Assets"],["transfers","⇄","Transfers"+(pc()?" ("+pc()+")":"")]];if(user.role=="admin")items.push(["admin","⚙","Admin"]);
$("#nav").innerHTML=items.map(([v,i,l])=>`<button class="${view==v?"on":""}" onclick="go('${v}')"><span>${i}</span>${l}</button>`).join("")}
function go(v){view=v;S.pg=1;render()}
function switchUser(v){if(v=="Admin"){user={name:"Admin User",id:"USR-0001",dept:"All",role:"admin"}}else{const m=v.endsWith(":m"),d=v.replace(":m",""),e=EMP.filter(x=>x.dept==d)[m?1:0];user={name:e.name,id:e.id,dept:d,role:"dept",head:!m};if(view=="admin")view="dashboard"}ttab=v=="Admin"?"pend":"inbox";S={q:"",st:"",bd:"",cd:"",sort:"code",dir:1,pg:1};if(!logins[user.id])login();else log("Switched session");render()}
function head(t,s){return`<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="row"><select id="who" onchange="switchUser(this.value)" style="width:auto" aria-label="Switch user">${[["Admin","Admin"],...DEPTS.flatMap(d=>[[d[0],d[0]+" – Head"],[d[0]+":m",d[0]+" – Member"]])].map(([v,l])=>`<option value="${v}" ${v==(user.role=="admin"?"Admin":user.dept+(user.head?"":":m"))?"selected":""}>${l}</option>`).join("")}</select><button class="btn" onclick="theme()">◐ Theme</button></div></div>`}
function theme(){const r=document.documentElement,d=r.dataset.theme=="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
function render(){nav();$("#main").innerHTML=view=="dashboard"?dash():view=="photos"?photosPg():view=="transfers"?transPg():view=="assets"?list():adminPg();if(view=="assets")bindList()}
function dash(){const l=scope(),s=stats(l),adm=user.role=="admin";
const depRows=(adm?DEPTS.map(d=>d[0]):[user.dept]).map(d=>{const x=stats(assets.filter(a=>a.dept==d));return`<div class="dp"><span>${d}</span><div class="bar"><b style="width:${x.pct}%;background:${DC[d]}"></b></div><span>${x.c}/${x.t} · ${x.pct}%</span></div>`}).join("");
const dist=DEPTS.map(d=>d[0]),tot=assets.length;let acc=0;const cg=dist.map(d=>{const n=assets.filter(a=>a.dept==d).length,a0=acc;acc+=n/tot*100;return`${DC[d]} ${a0}% ${acc}%`}).join(",");
const rec=[...l].filter(a=>a.status=="Completed").sort((a,b)=>b.updated-a.updated).slice(0,6);
const act=logs.filter(x=>adm||x.dept==user.dept).slice(0,6);
return head(adm?"Verification Overview":user.dept+" Department","Signed in as "+user.name+" · "+user.id)+`
<div class="grid g4"><div class="card kpi"><div class="l">${adm?"Total assets":"Assigned to you"}</div><div class="v">${s.t}</div><div class="s">${adm?"7 departments":user.dept}</div></div>
<div class="card kpi"><div class="l">Completed</div><div class="v" style="color:var(--ok)">${s.c}</div><div class="s">Verified</div></div>
<div class="card kpi"><div class="l">Pending</div><div class="v" style="color:var(--wa)">${s.p}</div><div class="s">Awaiting verification</div></div>
<div class="card kpi"><div class="l">Completion</div><div class="v">${s.pct}%</div><div class="bar" style="margin-top:8px"><b style="width:${s.pct}%"></b></div></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>${adm?"Department progress":"Completion chart"}</h3>${adm?depRows:`<div class="ring" style="--p:${s.pct}"><div>${s.pct}%</div></div><div class="sub" style="text-align:center;margin-top:10px">${s.c} of ${s.t} verified</div>`}</div>
<div class="card"><h3>${adm?"Asset distribution":"Quick search"}</h3>${adm?`<div class="row" style="gap:20px"><div class="ring" style="background:conic-gradient(${cg});--p:0"><div style="width:76px;height:76px;font-size:16px">${tot}</div></div><div style="font-size:12px">${DEPTS.map(d=>`<div><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${DC[d[0]]};margin-right:6px"></span>${d[0]} · ${assets.filter(a=>a.dept==d[0]).length}</div>`).join("")}</div></div>`:`<input type="search" id="qs" placeholder="Type asset code e.g. AST0000…" oninput="qs(this.value)"><div id="qr" class="sub" style="margin-top:10px">Start typing to find an asset in your department.</div>`}</div></div>
${adm?`<div class="card" style="margin-top:14px"><h3>Quick search</h3><input type="search" id="qs" placeholder="Search any asset code…" oninput="qs(this.value)"><div id="qr" class="sub" style="margin-top:10px">Start typing to find an asset.</div></div>`:""}
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Recent verifications</h3>${rec.map(a=>`<div class="act"><span class="dot" style="background:var(--ok)"></span><div style="flex:1"><span class="mono" style="cursor:pointer" onclick="openA('${a.code}')">${a.code}</span> · ${a.dept}<div class="sub">${a.empName} · ${a.building}/F${a.floor} · ${fmt(a.updated)}</div></div></div>`).join("")||'<div class="sub">None yet</div>'}</div>
<div class="card"><h3>Recent activity</h3>${act.map(x=>`<div class="act"><span class="dot"></span><div><b>${x.user}</b> · ${x.action}${x.code!="—"?` · <span class="mono">${x.code}</span>`:""}<div class="sub">${fmt(x.ts)}</div></div></div>`).join("")||'<div class="sub">Actions you take will appear here.</div>'}</div></div>`}
function qs(v){const r=$("#qr");if(!v.trim()){r.textContent="Start typing to find an asset.";return}const m=scope().filter(a=>a.code.toLowerCase().includes(v.toLowerCase())).slice(0,6);
r.innerHTML=m.map(a=>`<div class="act" style="align-items:center"><span class="mono" style="cursor:pointer;color:var(--tx)" onclick="openA('${a.code}')">${a.code}</span><span style="flex:1">${a.dept}</span>${badge(a.status)}</div>`).join("")||"No match"}
function filtered(){let l=scope().filter(a=>(!S.q||a.code.toLowerCase().includes(S.q.toLowerCase())||a.empName.toLowerCase().includes(S.q.toLowerCase()))&&(!S.st||a.status==S.st)&&(!S.bd||a.building==S.bd)&&(!S.cd||a.cond==S.cd));
return l.sort((a,b)=>(a[S.sort]>b[S.sort]?1:a[S.sort]<b[S.sort]?-1:0)*S.dir)}
function list(){const f=filtered(),pages=Math.max(1,Math.ceil(f.length/10));S.pg=Math.min(S.pg,pages);const rows=f.slice((S.pg-1)*10,S.pg*10),o=(a,v)=>`<option value="${v}" ${a==v?"selected":""}>${v||"All"}</option>`;
const th=(k,l)=>`<th onclick="sortBy('${k}')">${l}${S.sort==k?(S.dir>0?" ↑":" ↓"):""}</th>`;
return head("Assets",f.length+" assets"+(user.role=="admin"?" across all departments":" in "+user.dept))+`
<div class="row" style="margin-bottom:14px"><div style="flex:1;min-width:200px"><input type="search" id="q" placeholder="Search asset code or employee…" value="${esc(S.q)}"></div>
<select id="fs" style="width:auto"><option value="">All status</option>${["Pending Verification","Completed"].map(v=>`<option ${S.st==v?"selected":""}>${v}</option>`).join("")}</select>
<select id="fb" style="width:auto"><option value="">All buildings</option>${BLD.map(v=>`<option ${S.bd==v?"selected":""}>${v}</option>`).join("")}</select>
<select id="fc" style="width:auto"><option value="">All conditions</option>${COND.map(v=>`<option ${S.cd==v?"selected":""}>${v}</option>`).join("")}</select>
<button class="btn pri" onclick="scan()">⌗ Scan QR</button></div>
<div class="tw"><table><thead><tr>${th("code","Asset Code")}${th("dept","Department")}${th("building","Building")}${th("floor","Floor")}${th("empName","Person In Charge")}${th("status","Status")}${th("cond","Condition")}${th("updated","Updated")}<th>Actions</th></tr></thead><tbody>
${rows.map(a=>`<tr><td class="mono">${a.code}</td><td><span class="dot" style="display:inline-block;background:${DC[a.dept]};margin-right:6px"></span>${a.dept}</td><td>${a.building||"—"}</td><td>${a.floor||"—"}</td><td>${a.empName||"—"}</td><td>${badge(a.status=="Pending Verification"&&a.pic?"Photo Uploaded":a.status)}</td><td class="c-${a.cond}">${a.cond||"—"}</td><td>${fmt(a.updated)}</td><td><button class="btn sm" onclick="openA('${a.code}')">${a.status=="Completed"?"View":"Verify"}</button></td></tr>`).join("")||'<tr><td colspan="9" class="sub" style="text-align:center;padding:30px">No assets match your filters</td></tr>'}</tbody></table></div>
<div class="row" style="justify-content:space-between;margin-top:12px"><span class="sub">Page ${S.pg} of ${pages}</span><div class="row"><button class="btn sm" ${S.pg<2?"disabled":""} onclick="S.pg--;render()">Prev</button><button class="btn sm" ${S.pg>=pages?"disabled":""} onclick="S.pg++;render()">Next</button></div></div>`}
function bindList(){const q=$("#q");q.oninput=()=>{S.q=q.value;S.pg=1;const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
[["fs","st"],["fb","bd"],["fc","cd"]].forEach(([i,k])=>$("#"+i).onchange=e=>{S[k]=e.target.value;S.pg=1;render()})}
function sortBy(k){S.dir=S.sort==k?-S.dir:1;S.sort=k;render()}
function scan(){const p=scope().filter(a=>a.status!="Completed");if(!p.length)return toast("No pending assets to scan");const a=pick(p);toast("QR scanned: "+a.code);log("QR scan",a.code);openA(a.code)}
let tmpPic=null;
function openA(code){const a=assets.find(x=>x.code==code);open=a;tmpPic=a.pic;log("Opened asset",code);const done=a.status=="Completed",ro=done?"disabled":"";
const opts=(arr,v,ph)=>`<option value="">${ph}</option>`+arr.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
const emps=EMP.filter(e=>e.dept==a.dept);
$("#panel").innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="mono" style="font-size:18px">${a.code}</div><div class="sub">${a.dept} Department</div></div><div class="row">${badge(a.status)}<button class="btn sm" onclick="closeA()">✕</button></div></div><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
<div class="f2"><div class="f"><label>Company *</label><select id="fcm" ${ro}>${opts(COMP,a.company,"Select")}</select></div><div class="f"><label>Building *</label><select id="fbd" ${ro}>${opts(BLD,a.building,"Select")}</select></div></div>
<div class="f2"><div class="f"><label>Floor *</label><input type="text" id="ffl" value="${esc(a.floor)}" ${ro}></div><div class="f"><label>Current location *</label><input type="text" id="flc" value="${esc(a.loc)}" ${ro}></div></div>
<div class="f"><label>Asset picture *</label><label class="pic" id="pv">${a.pic?`<img src="${a.pic}" alt="Asset">`:"📷 Click to upload a photo"}<input type="file" accept="image/*" hidden id="fp" ${ro}></label></div>
<div class="f"><label>Department</label><input type="text" value="${a.dept}" disabled></div>
<div class="f2"><div class="f"><label>Person in charge *</label><select id="fe" ${ro} onchange="pickEmp(this.value)">${`<option value="">Select employee</option>`+emps.map(e=>`<option value="${e.id}" ${e.id==a.empId?"selected":""}>${e.name}</option>`).join("")}</select></div><div class="f"><label>Employee ID</label><input type="text" id="fid" value="${a.empId}" disabled></div></div>
<div class="f"><label>Employee name</label><input type="text" id="fnm" value="${esc(a.empName)}" disabled></div>
<div class="f"><label>Asset condition *</label><select id="fcd" ${ro}>${opts(COND,a.cond,"Select")}</select></div>
<div class="f"><label>Remarks</label><textarea id="frm" rows="3" ${ro}>${esc(a.remarks)}</textarea></div><div id="er" class="err"></div>
${done?`<div class="sub">Verified ${fmt(a.updated)} — read only.</div>`:`<button class="btn pri" style="width:100%;margin-top:6px" onclick="submitA()">Submit verification</button>`}`;
$("#dr").classList.add("open");const fp=$("#fp");if(fp)fp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{tmpPic=r.result;$("#pv").innerHTML=`<img src="${tmpPic}" alt="Asset"><input type="file" accept="image/*" hidden id="fp">`;$("#fp").onchange=fp.onchange};r.readAsDataURL(f)}}
function pickEmp(id){const e=EMP.find(x=>x.id==id);$("#fid").value=e?e.id:"";$("#fnm").value=e?e.name:""}
function closeA(){$("#dr").classList.remove("open");render()}
$("#dr").onclick=e=>{if(e.target.id=="dr")closeA()};
function submitA(){const v=i=>$("#"+i).value.trim(),a=open;if(transfers.some(t=>t.code==a.code&&t.status=="Pending Approval")){$("#er").textContent="A transfer request is pending for this asset. Resolve it first.";return}const req=[["fcm","Company"],["fbd","Building"],["ffl","Floor"],["flc","Location"],["fe","Person in charge"],["fcd","Condition"]].filter(([i])=>!v(i));
const miss=req.map(r=>r[1]);if(!tmpPic)miss.push("Asset picture");if(miss.length){$("#er").textContent="Please complete: "+miss.join(", ");return}
Object.assign(a,{company:v("fcm"),building:v("fbd"),floor:v("ffl"),loc:v("flc"),empId:v("fid"),empName:v("fnm"),cond:v("fcd"),remarks:v("frm"),pic:tmpPic,status:"Completed",updated:Date.now()});
log("Verified asset (Pending → Completed)",a.code);toast(a.code+" marked Completed");closeA()}
let ptab="pending",pdept="IT";const pscope=()=>user.role=="admin"?assets.filter(a=>a.dept==pdept):scope();
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
function upl(code,inp){const f=inp.files[0];if(!f)return;rd(f,u=>{const a=assets.find(x=>x.code==code);a.pic=u;a.updated=Date.now();log("Photo uploaded",code);toast("Photo saved for "+code);render()})}
function bulk(inp){const fs=[...inp.files];let n=fs.length,m=0,x=0;const fin=()=>{toast(m+" photo(s) matched"+(x?", "+x+" unmatched (name files like AST000012.jpg)":""));render()};
fs.forEach(f=>{const mt=f.name.toUpperCase().match(/AST\d{6}/),a=mt&&pscope().find(s=>s.code==mt[0]&&s.status!="Completed");if(!a){x++;if(--n==0)fin();return}rd(f,u=>{a.pic=u;a.updated=Date.now();log("Photo uploaded (bulk)",a.code);m++;if(--n==0)fin()})})}
function photosPg(){const l=pscope(),np=l.filter(a=>!a.pic&&a.status!="Completed"),up=l.filter(a=>a.pic&&a.status!="Completed"),dn=l.filter(a=>a.status=="Completed");
const T=[["pending","Pending – photo needed",np],["uploaded","Photo uploaded – details needed",up],["done","Done",dn]],cur=T.find(t=>t[0]==ptab)[2];
const card=a=>{const done=a.status=="Completed";return`<div class="card"><div class="th">${a.pic?`<img src="${a.pic}" alt="${a.code}">`:'<span>📷<br>No photo yet</span>'}</div><div class="row" style="justify-content:space-between;margin:10px 0 2px"><span class="mono">${a.code}</span>${badge(done?"Completed":a.pic?"Photo Uploaded":"Pending Verification")}</div><div class="sub">${a.dept}${done?" · "+a.building+"/F"+a.floor:""}</div><div class="row" style="margin-top:10px">${done?`<button class="btn sm" onclick="openA('${a.code}')">View</button>`:`<label class="btn sm ${a.pic?"":"pri"}" style="cursor:pointer">${a.pic?"Replace photo":"Upload photo"}<input type="file" accept="image/*" hidden onchange="upl('${a.code}',this)"></label>${a.pic?`<button class="btn sm pri" onclick="openA('${a.code}')">Fill details</button>`:""}`}</div></div>`};
return head("Photo Upload","Capture photos first, then complete each asset's details")+(user.role=="admin"?`<div class="row" style="margin-bottom:12px"><span class="sub">Viewing department:</span><select style="width:auto" onchange="pdept=this.value;render()">${DEPTS.map(d=>`<option ${d[0]==pdept?"selected":""}>${d[0]}</option>`).join("")}</select></div>`:`<div class="sub" style="margin-bottom:12px">Showing only ${user.dept} department asset codes</div>`)+`<div class="tabs">${T.map(([k,t,a])=>`<button class="${ptab==k?"on":""}" onclick="ptab='${k}';render()">${t} (${a.length})</button>`).join("")}</div>`+(ptab=="pending"?`<div class="drop"><div><b>Bulk upload photos</b><div class="sub">Select many images at once. Name each file with its asset code (e.g. AST000012.jpg) to auto-match.</div></div><label class="btn pri" style="cursor:pointer">⬆ Select photos<input type="file" accept="image/*" multiple hidden onchange="bulk(this)"></label></div>`:"")+`<div class="pgrid">${cur.slice(0,40).map(card).join("")||'<div class="sub">Nothing here.</div>'}</div>`+(cur.length>40?`<div class="sub" style="margin-top:10px">Showing 40 of ${cur.length}</div>`:"")}
let ttab="inbox";
const tType=t=>t.lender==t.toDept?"Internal move":t.reqDept==t.lender?"Transfer out":"Borrow request";
const canAp=t=>user.role=="dept"&&user.head&&user.dept==t.lender&&t.status=="Pending Approval"&&user.id!=t.reqId;
function pc(){const P=transfers.filter(t=>t.status=="Pending Approval");return user.role=="admin"?P.length:user.head?P.filter(t=>t.lender==user.dept).length:0}
function applyT(t,by,note){const a=assets.find(x=>x.code==t.code);if(a.dept!=t.toDept){a.empId="";a.empName=""}Object.assign(a,{dept:t.toDept,building:t.toBuilding,floor:t.toFloor,loc:t.toLoc,status:"Pending Verification",updated:Date.now()});Object.assign(t,{status:"Approved",by,note,decTs:Date.now()})}
function transPg(){const adm=user.role=="admin",d=user.dept,P=t=>t.status=="Pending Approval";
const T=adm?[["pend","Pending approval",transfers.filter(P)],["all","All requests",transfers]]:[["inbox","Needs our approval",transfers.filter(t=>P(t)&&t.lender==d)],["mine","Our requests",transfers.filter(t=>t.reqDept==d)],["hist","History",transfers.filter(t=>!P(t)&&(t.lender==d||t.reqDept==d||t.toDept==d))]];
const cur=T.find(x=>x[0]==ttab)||T[0];
const row=t=>`<tr><td class="mono">${t.id}</td><td class="mono">${t.code}</td><td>${tType(t)}<div class="sub" style="max-width:200px;white-space:normal">${esc(t.reason)}</div></td><td>${t.lender}<div class="sub">${t.from}</div></td><td>${t.toDept}<div class="sub">${t.toBuilding} / F${esc(t.toFloor)} / ${esc(t.toLoc)}</div></td><td>${t.reqName}<div class="sub">${t.reqDept}</div></td><td>${fmt(t.ts)}</td><td>${badge(t.status)}${t.by?`<div class="sub">${esc(t.by)}</div>`:""}${t.note?`<div class="sub" style="max-width:200px;white-space:normal">${esc(t.note)}</div>`:""}</td><td>${canAp(t)?`<button class="btn sm pri" onclick="openDec('${t.id}','approve')">Approve</button> <button class="btn sm" onclick="openDec('${t.id}','reject')">Reject</button>`:P(t)?`<span class="sub">Awaiting ${t.lender} Head</span>`:""}</td></tr>`;
return head("Transfers","Moves between floors, locations and departments")+`<div class="card" style="margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div class="sub" style="max-width:660px">Any relocation in the factory needs approval from the <b>lender</b> (the department that holds the asset), not the borrower. Only the lender department head can approve. Once approved, the asset moves and returns to <b>Pending Verification</b> at its new location.</div>${adm?"":`<button class="btn pri" onclick="openReq()">+ New request</button>`}</div><div class="tabs">${T.map(([k,l,a])=>`<button class="${cur[0]==k?"on":""}" onclick="ttab='${k}';render()">${l} (${a.length})</button>`).join("")}</div><div class="tw"><table style="min-width:1000px"><thead><tr>${["ID","Asset","Type","Lender (from)","Destination","Requested by","Date","Status","Action"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${cur[2].map(row).join("")||'<tr><td colspan="9" class="sub" style="text-align:center;padding:30px">No requests here</td></tr>'}</tbody></table></div>`}
function openReq(){const av=assets.filter(a=>a.dept!="—"&&!transfers.some(t=>t.code==a.code&&t.status=="Pending Approval"));
$("#panel").innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="font-size:18px">New transfer request</h1><button class="btn sm" onclick="closeA()">✕</button></div><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">
<div class="f"><label>Asset code * (any department)</label><input type="text" id="ta" list="tl" placeholder="Start typing AST…" oninput="hint()"><datalist id="tl">${av.map(a=>`<option value="${a.code}">${a.dept} · ${a.building||"—"}/F${a.floor||"—"}</option>`).join("")}</datalist></div><div id="hn" class="sub" style="margin:-4px 0 12px"></div>
<div class="f"><label>Receiving department *</label><select id="td" onchange="hint()">${DEPTS.map(d=>`<option ${d[0]==user.dept?"selected":""}>${d[0]}</option>`).join("")}</select></div>
<div class="f2"><div class="f"><label>Destination building *</label><select id="tb"><option value="">Select</option>${BLD.map(b=>`<option>${b}</option>`).join("")}</select></div><div class="f"><label>Floor *</label><input type="text" id="tf"></div></div>
<div class="f"><label>Destination location *</label><input type="text" id="tlc" placeholder="e.g. Assembly Line 2"></div><div class="f"><label>Reason *</label><textarea id="tr" rows="3"></textarea></div><div id="er" class="err"></div><button class="btn pri" style="width:100%;margin-top:6px" onclick="submitReq()">Submit request</button>`;$("#dr").classList.add("open")}
function hint(){const a=assets.find(x=>x.code==$("#ta").value.trim().toUpperCase()),h=$("#hn");if(!a){h.textContent="";return}h.textContent=user.head&&user.dept==a.dept?"You are the lender head, so this will be approved automatically.":`Held by ${a.dept}. Approval needed from the ${a.dept} Head (lender), not the receiving department.`}
function submitReq(){const v=i=>$("#"+i).value.trim(),a=assets.find(x=>x.code==v("ta").toUpperCase()),e=$("#er");
if(!a||a.dept=="—")return e.textContent="Enter a valid asset code from the list.";
if(transfers.some(t=>t.code==a.code&&t.status=="Pending Approval"))return e.textContent="This asset already has a pending request.";
if(!v("tb")||!v("tf")||!v("tlc")||!v("tr"))return e.textContent="Please complete all required fields.";
const t={id:"TRF-"+String(transfers.length+1).padStart(4,"0"),code:a.code,lender:a.dept,toDept:v("td"),toBuilding:v("tb"),toFloor:v("tf"),toLoc:v("tlc"),from:(a.building||"—")+" / F"+(a.floor||"—")+" / "+(a.loc||"—"),reason:v("tr"),reqName:user.name,reqId:user.id,reqDept:user.dept,status:"Pending Approval",ts:Date.now(),by:"",note:"",decTs:0};
transfers.unshift(t);log("Transfer requested ("+tType(t)+")",a.code);
if(user.head&&user.dept==a.dept){applyT(t,user.name+" (lender head, auto-approved)","");log("Transfer auto-approved",a.code);toast(a.code+" moved")}else toast("Request sent to "+a.dept+" Head");
ttab="mine";closeA()}
function openDec(id,act){const t=transfers.find(x=>x.id==id),ap=act=="approve";
$("#panel").innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="font-size:18px">${ap?"Approve":"Reject"} ${t.id}</h1><button class="btn sm" onclick="closeA()">✕</button></div><hr style="border:0;border-top:1px solid var(--bd);margin:16px 0"><div class="card" style="margin-bottom:14px"><div class="mono">${t.code}</div><div class="sub">${tType(t)} · requested by ${t.reqName} (${t.reqDept})</div><div style="margin-top:10px">From: <b>${t.from}</b><br>To: <b>${t.toDept} · ${t.toBuilding} / F${esc(t.toFloor)} / ${esc(t.toLoc)}</b></div><div class="sub" style="margin-top:8px">Reason: ${esc(t.reason)}</div></div><div class="f"><label>Note ${ap?"(optional)":"*"}</label><textarea id="dn" rows="3"></textarea></div><div id="er" class="err"></div><button class="btn pri" style="width:100%" onclick="doDec('${id}','${act}')">Confirm ${ap?"approval":"rejection"}</button>`;$("#dr").classList.add("open")}
function doDec(id,act){const t=transfers.find(x=>x.id==id),n=$("#dn").value.trim();if(!canAp(t))return $("#er").textContent="Only the lender department head can decide this request.";
if(act=="reject"&&!n)return $("#er").textContent="Please give a reason for rejection.";
if(act=="approve"){applyT(t,user.name,n);log("Transfer approved",t.code)}else{Object.assign(t,{status:"Rejected",by:user.name,note:n,decTs:Date.now()});log("Transfer rejected",t.code)}
toast(t.code+(act=="approve"?" transferred":" request rejected"));closeA()}
function adminPg(){const T=[["import","Import"],["assign","Assign"],["history","Import history"],["progress","Department progress"],["audit","Audit logs"]];
const un=assets.filter(a=>a.status=="Imported"),s=stats(assets);let b="";
if(atab=="import")b=`<div class="card"><h3>Import asset codes</h3><p class="sub">Mock import: adds a batch of 10 new codes in <b>Imported</b> status. Assign them to a department to move them to Pending Verification.</p><button class="btn pri" onclick="doImport()">⬆ Import 10 asset codes</button><div class="sub" style="margin-top:12px">${assets.length} codes in system · ${un.length} awaiting assignment</div></div>`;
if(atab=="assign")b=`<div class="tw"><table><thead><tr><th>Asset Code</th><th>Status</th><th>Department</th><th></th></tr></thead><tbody>${(un.length?un:[]).map(a=>`<tr><td class="mono">${a.code}</td><td>${badge(a.status)}</td><td><select id="as-${a.code}" style="width:180px">${DEPTS.map(d=>`<option>${d[0]}</option>`).join("")}</select></td><td><button class="btn sm pri" onclick="assign('${a.code}')">Assign</button></td></tr>`).join("")||'<tr><td colspan="4" class="sub" style="text-align:center;padding:30px">All codes are assigned. Use Import to add more.</td></tr>'}</tbody></table></div>`;
if(atab=="history")b=`<div class="tw"><table><thead><tr><th>Batch</th><th>File</th><th>Codes</th><th>Imported by</th><th>Date</th><th>Status</th></tr></thead><tbody>${hist.map(h=>`<tr><td class="mono">${h.id}</td><td>${h.file}</td><td>${h.n}</td><td>${h.by}</td><td>${fmt(h.ts)}</td><td><span class="badge b-Completed">${h.st}</span></td></tr>`).join("")}</tbody></table></div>`;
if(atab=="progress")b=`<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><div class="l">Total</div><div class="v">${s.t}</div></div><div class="card kpi"><div class="l">Completed</div><div class="v" style="color:var(--ok)">${s.c}</div></div><div class="card kpi"><div class="l">Pending</div><div class="v" style="color:var(--wa)">${s.p}</div></div><div class="card kpi"><div class="l">Completion</div><div class="v">${s.pct}%</div></div></div><div class="card">${DEPTS.map(([d])=>{const x=stats(assets.filter(a=>a.dept==d));return`<div class="dp"><span>${d}</span><div class="bar"><b style="width:${x.pct}%;background:${DC[d]}"></b></div><span>${x.c}/${x.t} · ${x.pct}%</span></div>`}).join("")}</div>`;
if(atab=="audit")b=`<div class="tw"><table style="min-width:1100px"><thead><tr>${["User","User ID","Dept","Login time","Device","Browser","OS","IP","Action","Timestamp","Asset"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${logs.slice(0,60).map(x=>`<tr><td>${x.user}</td><td class="mono">${x.uid}</td><td>${x.dept}</td><td>${fmt(x.login)}</td><td>${x.dt}</td><td>${x.br}</td><td>${x.os}</td><td class="mono">${x.ip}</td><td>${x.action}</td><td>${fmt(x.ts)}</td><td class="mono">${x.code}</td></tr>`).join("")}</tbody></table></div>`;
return head("Administration","Import, assign and monitor asset verification")+`<div class="tabs">${T.map(([k,l])=>`<button class="${atab==k?"on":""}" onclick="atab='${k}';render()">${l}</button>`).join("")}</div>${b}`}
function doImport(){const n=assets.length;for(let i=1;i<=10;i++)assets.push({code:"AST"+String(n+i).padStart(6,"0"),dept:"—",status:"Imported",company:"",building:"",floor:"",loc:"",empId:"",empName:"",cond:"",remarks:"",pic:null,updated:Date.now()});
hist.unshift({id:"IMP-"+String(hist.length+1).padStart(3,"0"),file:"asset_codes_batch"+(hist.length+1)+".xlsx",n:10,by:user.name,ts:Date.now(),st:"Success"});log("Imported 10 asset codes","AST"+String(n+1).padStart(6,"0")+"…");toast("10 asset codes imported");render()}
function assign(c){const a=assets.find(x=>x.code==c);a.dept=$("#as-"+c).value;a.status="Pending Verification";log("Assigned to "+a.dept,c);toast(c+" → "+a.dept);render()}
login();render();
</script></body></html>
